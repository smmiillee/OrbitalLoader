name: Protect EXE

on:
  workflow_dispatch:
    inputs:
      customer_id:
        description: 'Customer ID for license'
        required: true
      expiry_days:
        description: 'License validity (days)'
        default: '365'

jobs:
  protect:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Find EXE in incoming/
        id: find_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path ./incoming -File | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No file found in ./incoming/"
            exit 1
          }
          Write-Output "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Output "Found: $($exe.FullName)"

      - name: Protect with loader
        env:
          LOADER_MASTER_SECRET: ${{ secrets.LOADER_MASTER_SECRET }}
        run: |
          python -m build_tools.builder protect-exe "${{ steps.find_exe.outputs.exe_path }}" `
            -o ./protected `
            --customer "${{ github.event.inputs.customer_id }}" `
            --days ${{ github.event.inputs.expiry_days }}

      - name: Build customer EXE launcher
        run: |
          pyinstaller --onefile --windowed --add-data "protected/license.key;." --add-data "protected/payload.enc;." --add-data "protected/payload.meta;." protected/loader.py -n SecureLauncher

      - name: Install NSIS
        run: |
          choco install nsis -y

      - name: Create silent installer
        shell: pwsh
        run: |
          $nsisScript = @"
          Name "Secure Launcher"
          OutFile "${{ github.event.inputs.customer_id }}-Launcher.exe"
          RequestExecutionLevel user
          SetCompressor lzma
          SilentInstall silent
          Section
            InitPluginsDir
            SetOutPath `$PLUGINSDIR
            File "dist\SecureLauncher.exe"
            File "protected\license.key"
            File "protected\payload.enc"
            File "protected\payload.meta"
            ExecWait `"SecureLauncher.exe"`
          SectionEnd
          "@
          $nsisScript | Out-File -Encoding ASCII ./installer.nsi
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 ./installer.nsi

      - name: Upload single-file package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.customer_id }}-Launcher
          path: ./*-Launcher.exe
          retention-days: 30

      - name: Summary
        shell: pwsh
        run: |
          Write-Output "## Build Complete" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- Customer: ${{ github.event.inputs.customer_id }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- Single silent EXE: ${{ github.event.inputs.customer_id }}-Launcher.exe" >> $env:GITHUB_STEP_SUMMARY
