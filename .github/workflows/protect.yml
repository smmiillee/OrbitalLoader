name: Protect EXE(s)

on:
  workflow_dispatch:
    inputs:
      customer_id:
        description: 'Customer ID for license'
        required: true
        type: string
      expiry_days:
        description: 'License validity (days)'
        default: '365'
        type: string
      embed_license:
        description: 'Embed a license now? UNCHECK for first-run flow (customer gets HWID, you run Generate License, they drop license.key next to the EXE)'
        required: false
        default: true
        type: boolean
      hardware_id:
        description: "Hardware ID from hardware_id.txt (only used when 'Embed a license now' is checked)"
        required: false
        default: ''
        type: string

jobs:
  protect:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Protect with loader
        env:
          LOADER_MASTER_SECRET: ${{ secrets.LOADER_MASTER_SECRET }}
          HWID: ${{ github.event.inputs.hardware_id }}
          EMBED_LICENSE: ${{ github.event.inputs.embed_license }}
        shell: bash
        run: |
          set -e
          mapfile -t EXES < <(find incoming -maxdepth 1 -type f -iname '*.exe' | sort)
          if [ ${#EXES[@]} -eq 0 ]; then
            echo "::error::No .exe files found in incoming/"
            exit 1
          fi
          echo "Found ${#EXES[@]} EXE(s):"
          printf '  %s\n' "${EXES[@]}"

          CLEAN_HWID=$(printf '%s' "$HWID" | tr -d '[:space:]')

          ARGS=(protect-exe -o ./protected)
          ARGS+=(--customer "${{ github.event.inputs.customer_id }}")
          ARGS+=(--days "${{ github.event.inputs.expiry_days }}")
          ARGS+=("${EXES[@]}")

          if [ "$EMBED_LICENSE" != "true" ]; then
            echo "[+] First-run flow: shipping WITHOUT an embedded license"
            ARGS+=(--no-embed-license)
          elif [ -n "$CLEAN_HWID" ]; then
            echo "[+] Embedding license bound to HWID: $CLEAN_HWID"
            ARGS+=(--hardware-id "$CLEAN_HWID")
          else
            echo "[!] No hardware_id provided - embedding UNBOUND license (works on any PC)"
            ARGS+=(--no-hardware)
          fi

          python -m build_tools.builder "${ARGS[@]}"

      - name: Build single-file launcher
        shell: bash
        run: |
          set -e
          ARGS=(--onefile --noconsole --name SecureLauncher --clean
                --distpath ./dist --workpath ./build_tmp --specpath ./build_tmp
                --collect-all customtkinter)
          for f in protected/payload_*.enc protected/payload_*.meta; do
            [ -e "$f" ] || continue
            ARGS+=(--add-data "$f;.")
          done
          pyinstaller "${ARGS[@]}" protected/SecureLauncher.py
          echo "=== dist/ ==="
          ls -la dist

      - name: Show protected output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse ./protected | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload protected bundle (folder version)
        uses: actions/upload-artifact@v4
        with:
          name: protected-${{ github.event.inputs.customer_id }}
          path: protected/
          retention-days: 30

      - name: Upload single-file launcher
        uses: actions/upload-artifact@v4
        with:
          name: SecureLauncher-${{ github.event.inputs.customer_id }}
          path: dist/SecureLauncher.exe
          retention-days: 30
