name: Protect EXE

on:
  workflow_dispatch:
    inputs:
      customer_id:
        description: 'Customer ID for license'
        required: true
        type: string
      expiry_days:
        description: 'License validity (days)'
        default: '365'
        type: string
      hardware_id:
        description: "Customer's hardware ID (hardware_id.txt). Leave EMPTY to disable HW binding."
        required: false
        default: ''
        type: string

jobs:
  protect:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Find EXE in incoming/
        id: find_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path ./incoming -File -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No .exe file found in ./incoming/"
            exit 1
          }
          Write-Output "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Output "Found: $($exe.FullName)"

      - name: Protect with loader
        env:
          LOADER_MASTER_SECRET: ${{ secrets.LOADER_MASTER_SECRET }}
          HWID: ${{ github.event.inputs.hardware_id }}
        shell: bash
        run: |
          set -e
          EXE_PATH=$(find incoming -maxdepth 1 -type f -iname '*.exe' | head -n 1)
          if [ -z "$EXE_PATH" ]; then
            echo "::error::No .exe found in incoming/"
            exit 1
          fi
          echo "Found: $EXE_PATH"

          CLEAN_HWID=$(printf '%s' "$HWID" | tr -d '[:space:]')

          ARGS=(protect-exe "$EXE_PATH" -o ./protected)
          ARGS+=(--customer "${{ github.event.inputs.customer_id }}")
          ARGS+=(--days "${{ github.event.inputs.expiry_days }}")

          if [ -n "$CLEAN_HWID" ]; then
            echo "[+] Binding license to customer HWID: $CLEAN_HWID"
            ARGS+=(--hardware-id "$CLEAN_HWID")
          else
            echo "[!] No hardware_id provided - hardware binding DISABLED"
            ARGS+=(--no-hardware)
          fi

          python -m build_tools.builder "${ARGS[@]}"

      - name: Show protected output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse ./protected | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload protected bundle
        uses: actions/upload-artifact@v4
        with:
          name: protected-${{ github.event.inputs.customer_id }}
          path: protected/
          retention-days: 30
