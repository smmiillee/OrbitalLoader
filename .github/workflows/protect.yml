name: Protect EXE

on:
  workflow_dispatch:
    inputs:
      customer_id:
        description: 'Customer ID for license'
        required: true
      expiry_days:
        description: 'License validity (days)'
        default: '365'
      features:
        description: 'Feature flags'
        default: 'basic'

jobs:
  protect:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Find EXE in incoming/
        id: find_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path ./incoming -File | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No file found in ./incoming/"
            exit 1
          }
          Write-Output "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Output "Found: $($exe.FullName)"

      - name: Protect with loader
        env:
          LOADER_MASTER_SECRET: ${{ secrets.LOADER_MASTER_SECRET }}
        run: |
          python -m build_tools.builder protect-exe "${{ steps.find_exe.outputs.exe_path }}" `
            -o ./protected `
            --customer "${{ github.event.inputs.customer_id }}" `
            --days ${{ github.event.inputs.expiry_days }} `
            --features ${{ github.event.inputs.features }}

      - name: Build customer EXE launcher
        run: |
          pyinstaller --onefile --noconsole protected/loader.py -n SecureLauncher

      - name: Install 7-Zip
        run: |
          choco install 7zip -y

      - name: Create SFX single-file package
        shell: pwsh
        run: |
          # Create temp folder with all files
          New-Item -ItemType Directory -Force -Path ./sfx-contents
          Copy-Item ./dist/SecureLauncher.exe ./sfx-contents/
          Copy-Item ./protected/license.key ./sfx-contents/
          Copy-Item ./protected/payload.enc ./sfx-contents/
          Copy-Item ./protected/payload.meta ./sfx-contents/
          
          # Find 7z and SFX module
          $7zPath = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $7zPath) { $7zPath = "C:\Program Files\7-Zip\7z.exe" }
          if (-not (Test-Path $7zPath)) { $7zPath = "C:\ProgramData\chocolatey\bin\7z.exe" }
          
          $sfxPath = Join-Path (Split-Path $7zPath) "7z.sfx"
          if (-not (Test-Path $sfxPath)) { $sfxPath = "C:\Program Files\7-Zip\7z.sfx" }
          if (-not (Test-Path $sfxPath)) { $sfxPath = "C:\ProgramData\chocolatey\lib\7zip\tools\7z.sfx" }
          
          Write-Output "7z: $7zPath"
          Write-Output "SFX: $sfxPath"
          
          # Create 7z archive then convert to SFX
          & $7zPath a -r ./archive.7z ./sfx-contents/*
          & $7zPath a -sfx"$sfxPath" ./SecureLauncher-SFX.exe ./archive.7z
          
          # Rename to customer-friendly name
          Rename-Item ./SecureLauncher-SFX.exe "./${{ github.event.inputs.customer_id }}-Launcher.exe"

      - name: Upload single-file package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.customer_id }}-Launcher
          path: ./*-Launcher.exe
          retention-days: 30

      - name: Summary
        shell: pwsh
        run: |
          Write-Output "## Build Complete" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- Customer: ${{ github.event.inputs.customer_id }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- Single file: `${{ github.event.inputs.customer_id }}-Launcher.exe`" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "Customer double-clicks one EXE, it self-extracts and runs." >> $env:GITHUB_STEP_SUMMARY
