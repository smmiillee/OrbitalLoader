name: Generate License for Customer

on:
  workflow_dispatch:
    inputs:
      customer_id:
        description: 'Customer name/ID'
        required: true
      hardware_id:
        description: 'Hardware ID from customer'
        required: true
      expiry_days:
        description: 'License validity (days)'
        default: '365'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate license
        env:
          LOADER_MASTER_SECRET: ${{ secrets.LOADER_MASTER_SECRET }}
        run: |
          HWID=$(echo "${{ github.event.inputs.hardware_id }}" | tr -d '[:space:]')
          echo "Input HWID: '${{ github.event.inputs.hardware_id }}'"
          echo "Stripped HWID: '$HWID'"
          
          python -m build_tools.builder generate-license \
            --customer "${{ github.event.inputs.customer_id }}" \
            --days ${{ github.event.inputs.expiry_days }} \
            --hardware-id "$HWID" \
            > raw_output.txt
          
          echo "=== Full output ==="
          cat raw_output.txt
          
          # Extract license key - line after "License key for"
          LICENSE_KEY=$(grep -A 1 "^License key for" raw_output.txt | tail -n 1 | tr -d '[:space:]')
          echo "=== Extracted key length: ${#LICENSE_KEY}"
          
          echo -n "$LICENSE_KEY" > license.key
          
          python3 << 'PYEOF'
          import base64, zlib, json
          with open('license.key', 'r') as f:
              key = f.read().strip()
          print(f"Key length: {len(key)}")
          padding = 4 - (len(key) % 4)
          if padding != 4:
              key += '=' * padding
          compressed = base64.urlsafe_b64decode(key)
          data = json.loads(zlib.decompress(compressed))
          print(f"Customer: {data['data'].get('customer_id')}")
          print(f"License HW: {data['data'].get('hardware_fingerprint')}")
          print(f"Expected HW: '$HWID'")
          print(f"MATCH: {data['data'].get('hardware_fingerprint') == '$HWID'}")
          PYEOF

      - name: Create artifact
        run: |
          mkdir -p license_output
          cp license.key license_output/
          echo "Customer: ${{ github.event.inputs.customer_id }}" > license_output/README.txt
          echo "Hardware: ${{ github.event.inputs.hardware_id }}" >> license_output/README.txt
          echo "Expiry: ${{ github.event.inputs.expiry_days }} days" >> license_output/README.txt

      - name: Upload license
        uses: actions/upload-artifact@v4
        with:
          name: license-${{ github.event.inputs.customer_id }}
          path: license_output/
          retention-days: 30
